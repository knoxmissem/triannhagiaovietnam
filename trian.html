<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri ân thầy cô 20/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#06020f;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%)}
#btn{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);padding:14px 30px;border:1px solid rgba(255,214,130,.7);border-radius:999px;background:rgba(20,8,40,.55);color:#ffe9b0;font:600 1rem "Be Vietnam Pro",sans-serif;letter-spacing:.5px;cursor:pointer;backdrop-filter:blur(6px);transition:background .3s,opacity .6s,box-shadow .3s;box-shadow:0 0 24px rgba(255,190,90,.25);z-index:2}
#btn:hover{background:rgba(255,214,130,.15)}
#btn.hide{opacity:0;pointer-events:none}
#card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none;visibility:hidden;opacity:0;transition:opacity 1.2s,visibility 1.2s;z-index:3}
#card.show{visibility:visible;opacity:1}
.box{pointer-events:auto;max-width:720px;text-align:center;background:rgba(10,4,25,.6);border:1px solid rgba(255,214,130,.35);border-radius:22px;padding:clamp(24px,5vw,48px);backdrop-filter:blur(8px);box-shadow:0 0 60px rgba(255,120,190,.2);transform:translateY(20px);transition:transform 1.2s}
#card.show .box{transform:none}
.kicker{font-size:.9rem;letter-spacing:4px;text-transform:uppercase;color:#ffd678}
h1{margin:12px 0 8px;font-size:clamp(1.8rem,5vw,3rem);font-weight:800;background:linear-gradient(90deg,#ffd6e0,#ffe9a8,#c9f5e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.msg{margin-top:18px;font-size:clamp(1rem,2.2vw,1.2rem);line-height:1.75;color:#f3eefc}
.sign{margin-top:22px;font-style:italic;color:#ffd6a0}
#close{margin-top:26px;padding:10px 24px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:600 .95rem "Be Vietnam Pro",sans-serif;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<button id="btn">Nhấn để xem lời tri ân</button>
<div id="card">
  <div class="box">
    <div class="kicker">Ngày Nhà giáo Việt Nam 20/11</div>
    <h1>Tri ân thầy cô</h1>
    <p class="msg" id="msg"></p>
    <p class="sign">Học trò của thầy cô</p>
    <button id="close">Đóng</button>
  </div>
</div>
<script>
const PHOTOS=["anh/1.jpg","anh/2.jpg","anh/3.jpg","anh/4.jpg","anh/5.jpg","anh/6.jpg","anh/7.jpg","anh/8.jpg"];
const GLOWS=["255,70,90","255,196,80","90,220,140","255,120,190"];
const BORDERS=["255,214,120","255,232,170","255,205,130","255,225,200"];
const SNOW=[[255,128,138],[255,214,130],[170,240,200],[245,245,255],[245,150,195],[215,150,240],[255,175,120]];
const TINTS=[[255,255,255],[190,210,255],[255,232,200]];
const MESSAGE="Kính gửi thầy cô, cảm ơn thầy cô đã kiên nhẫn gieo từng con chữ, từng bài học, và thắp lên trong chúng em niềm tin để bước tiếp trên con đường phía trước. Những lời giảng, những lần nhắc nhở và cả những ánh nhìn động viên ấy, chúng em luôn ghi nhớ. Chúc thầy cô luôn dồi dào sức khỏe, hạnh phúc bên gia đình và giữ mãi ngọn lửa yêu nghề. Chúc mừng Ngày Nhà giáo Việt Nam 20/11!";

const TAU=Math.PI*2;
const FOV=42*Math.PI/180;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rot=(P,V)=>({x:dot(P,V.right),y:dot(P,V.upv),z:dot(P,V.fwd)});

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1,t=0;

const stars=Array.from({length:1400},(_,i)=>{
  const u=rnd(-1,1),a=rnd(0,TAU),s=Math.sqrt(1-u*u);
  return{d:[s*Math.cos(a),u,s*Math.sin(a)],b:i<90?215:rnd(40,150),tint:TINTS[i%3],ph:rnd(0,TAU),sp:rnd(.6,2.6),big:i<90};
});

function flake(initial){
  return{x:rnd(-14,14),y:initial?rnd(-2,24):rnd(20,26),z:rnd(-14,14),r:rnd(.04,.09),vy:rnd(.6,1.4),ph:rnd(0,TAU),c:SNOW[Math.floor(Math.random()*SNOW.length)]};
}
const flakes=Array.from({length:520},()=>flake(true));

const photos=PHOTOS.map((src,i)=>{
  const img=new Image();
  const p={img,ok:false,aspect:1.5,glow:GLOWS[i%GLOWS.length],border:BORDERS[i%BORDERS.length],theta:TAU*i/PHOTOS.length+rnd(-.1,.1),radius:rnd(8.5,11.5),y0:4.6+rnd(-3.2,3.4),fq:[rnd(.35,.65),rnd(.35,.65)],ph:[rnd(0,TAU),rnd(0,TAU)]};
  img.onload=()=>{p.ok=true;p.aspect=img.naturalWidth/img.naturalHeight};
  img.src=src;
  return p;
});

const cam={yaw:.55,pitch:.2,dist:19,drag:false,px:0,py:0,idle:0};
const shoot={on:false,next:3,born:0,life:1,x0:0,y0:0,dx:0,dy:0,v:0};

const blobs=()=>{
  const m=Math.max(W,H);
  return[[.18,.25,.5*m,"rgba(70,25,150,0.35)"],[.82,.72,.6*m,"rgba(20,60,120,0.3)"],[.52,.48,.7*m,"rgba(60,20,90,0.25)"]];
};

function view(){
  const e=smooth(t/5.5);
  const k=(1-e)*(1-e);
  const d=cam.dist*(1+0.55*k);
  const yaw=cam.yaw+k;
  const cp=Math.cos(cam.pitch);
  const off=[d*cp*Math.sin(yaw),d*Math.sin(cam.pitch),d*cp*Math.cos(yaw)];
  const pos=[off[0],3.8+off[1],off[2]];
  const fwd=[-off[0]/d,-off[1]/d,-off[2]/d];
  let right=[-fwd[2],0,fwd[0]];
  const rl=Math.hypot(right[0],right[1],right[2]);
  right=right.map(v=>v/rl);
  const upv=[right[1]*fwd[2]-right[2]*fwd[1],right[2]*fwd[0]-right[0]*fwd[2],right[0]*fwd[1]-right[1]*fwd[0]];
  return{pos,right,upv,fwd,d};
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
}

function update(dt){
  t+=dt;
  cam.idle+=dt;
  if(!cam.drag&&cam.idle>2.5)cam.yaw+=.18*dt;
  cam.pitch=clamp(cam.pitch,-.35,1.45);
  cam.dist=clamp(cam.dist,8,40);
  for(let i=0;i<flakes.length;i++){
    const q=flakes[i];
    q.y-=q.vy*dt;
    q.x+=Math.sin(t*.7+q.ph)*.4*dt;
    if(q.y<-2)flakes[i]=flake(false);
  }
}

function drawBackground(){
  ctx.fillStyle="#06020f";
  ctx.fillRect(0,0,W,H);
  for(const[x,y,r,col]of blobs()){
    const g=ctx.createRadialGradient(x*W,y*H,0,x*W,y*H,r);
    g.addColorStop(0,col);
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
  }
}

function drawStars(V,f){
  for(const s of stars){
    const c=rot(s.d,V);
    if(c.z<=.2)continue;
    const x=Math.round(W/2+f*c.x/c.z),y=Math.round(H/2-f*c.y/c.z);
    if(x<1||y<1||x>=W-1||y>=H-1)continue;
    const k=s.b*(.62+.38*Math.sin(t*s.sp+s.ph))/255;
    const r=Math.min(255,s.tint[0]*k),g=Math.min(255,s.tint[1]*k),b=Math.min(255,s.tint[2]*k);
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(x,y,1,1);
    if(s.big){
      ctx.fillStyle=`rgba(${r|0},${g|0},${b|0},0.35)`;
      ctx.fillRect(x+1,y,1,1);ctx.fillRect(x-1,y,1,1);
      ctx.fillRect(x,y+1,1,1);ctx.fillRect(x,y-1,1,1);
    }
  }
}

function drawShooter(){
  const sc=H/680;
  if(!shoot.on){
    if(t<shoot.next)return;
    shoot.on=true;
    shoot.born=t;
    const a=rnd(15,40)*Math.PI/180;
    shoot.dx=Math.cos(a);
    shoot.dy=Math.sin(a);
    shoot.v=rnd(700,1000)*sc;
    shoot.x0=rnd(-.05,.65)*W;
    shoot.y0=rnd(.02,.35)*H;
    shoot.life=rnd(.8,1.2);
  }
  const age=t-shoot.born;
  if(age>shoot.life){
    shoot.on=false;
    shoot.next=t+rnd(5,10);
    return;
  }
  const hx=shoot.x0+shoot.dx*shoot.v*age,hy=shoot.y0+shoot.dy*shoot.v*age;
  const len=204*sc;
  const tx=hx-shoot.dx*len,ty=hy-shoot.dy*len;
  const fade=(1-age/shoot.life)*Math.min(1,age/.1);
  const g=ctx.createLinearGradient(hx,hy,tx,ty);
  g.addColorStop(0,`rgba(255,255,255,${.9*fade})`);
  g.addColorStop(1,"rgba(200,220,255,0)");
  ctx.strokeStyle=g;
  ctx.lineWidth=2*sc;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(hx,hy);
  ctx.lineTo(tx,ty);
  ctx.stroke();
}

function drawSnow(V,f){
  for(const q of flakes){
    const c=rot([q.x-V.pos[0],q.y-V.pos[1],q.z-V.pos[2]],V);
    if(c.z<=.5)continue;
    const x=W/2+f*c.x/c.z,y=H/2-f*c.y/c.z;
    if(x<-5||x>W+5||y<-5||y>H+5)continue;
    const fog=clamp(1.55-.65*(c.z/V.d),.5,1);
    ctx.fillStyle=`rgba(${q.c[0]},${q.c[1]},${q.c[2]},${.85*fog})`;
    ctx.beginPath();
    ctx.arc(x,y,Math.max(.6,q.r*f/c.z),0,TAU);
    ctx.fill();
  }
}

function drawPhotos(V,f){
  const appear=smooth((t-1)/2.5);
  if(appear<=.01)return;
  const list=[];
  for(const p of photos){
    const th=p.theta+.1*t;
    const rad=p.radius+Math.sin(t*p.fq[0]+p.ph[0])*.25;
    const P=[rad*Math.sin(th),p.y0+Math.sin(t*p.fq[1]+p.ph[1])*.35,rad*Math.cos(th)];
    const c=rot([P[0]-V.pos[0],P[1]-V.pos[1],P[2]-V.pos[2]],V);
    if(c.z<1.5)continue;
    list.push({p,c});
  }
  list.sort((a,b)=>b.c.z-a.c.z);
  for(const{p,c}of list){
    const k=f/c.z;
    const sx=W/2+c.x*k,sy=H/2-c.y*k;
    const sh=4.2*k,sw=sh*p.aspect;
    if(sw<4||sh<4)continue;
    const fog=clamp(1.3-(c.z-.64*V.d)/(1.36*V.d),.4,1);
    const x=sx-sw/2,y=sy-sh/2,r=Math.min(sw,sh)*.06;
    ctx.globalAlpha=appear*fog;
    ctx.shadowColor=`rgba(${p.glow},.85)`;
    ctx.shadowBlur=sh*.18;
    ctx.fillStyle=`rgba(${p.glow},.6)`;
    ctx.beginPath();
    ctx.roundRect(x,y,sw,sh,r);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x,y,sw,sh,r);
    ctx.clip();
    if(p.ok){
      ctx.drawImage(p.img,x,y,sw,sh);
    }else{
      const g=ctx.createLinearGradient(x,y,x+sw,y+sh);
      g.addColorStop(0,`rgb(${p.glow})`);
      g.addColorStop(1,"#1a0a2e");
      ctx.fillStyle=g;
      ctx.fillRect(x,y,sw,sh);
    }
    ctx.restore();
    ctx.strokeStyle=`rgb(${p.border})`;
    ctx.lineWidth=Math.max(2,sh*.012);
    ctx.beginPath();
    ctx.roundRect(x,y,sw,sh,r);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function draw(){
  const V=view();
  const f=.5*Math.min(H,W*.78)/Math.tan(FOV/2);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackground();
  drawStars(V,f);
  drawShooter();
  drawSnow(V,f);
  drawPhotos(V,f);
}

function frame(){
  const now=performance.now();
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

let last=performance.now();

canvas.addEventListener("pointerdown",e=>{
  cam.drag=true;cam.px=e.clientX;cam.py=e.clientY;
  canvas.classList.add("drag");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(!cam.drag)return;
  cam.yaw-=(e.clientX-cam.px)*.005;
  cam.pitch+=(e.clientY-cam.py)*.004;
  cam.px=e.clientX;cam.py=e.clientY;
  cam.idle=0;
});
const endDrag=()=>{cam.drag=false;canvas.classList.remove("drag")};
canvas.addEventListener("pointerup",endDrag);
canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("wheel",e=>{
  cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.001),8,40);
  cam.idle=0;
  e.preventDefault();
},{passive:false});

const btn=document.getElementById("btn");
const card=document.getElementById("card");
document.getElementById("msg").textContent=MESSAGE;
btn.addEventListener("click",()=>{
  card.classList.add("show");
  btn.classList.add("hide");
});
document.getElementById("close").addEventListener("click",()=>{
  card.classList.remove("show");
  btn.classList.remove("hide");
});

window.addEventListener("resize",resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
