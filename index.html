<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri Ân Ngày Nhà Giáo Việt Nam 20/11</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05030f;
    overflow: hidden;
    font-family: 'Segoe UI', 'Be Vietnam Pro', sans-serif;
    width: 100vw; height: 100vh;
  }

  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  #scene-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* ── SVG scene ── */
  #scene-svg {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%; height: 60%;
    z-index: 2;
    pointer-events: none;
  }

  /* ── Title ── */
  #title-block {
    position: fixed;
    top: 32px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  #title-block h1 {
    font-size: clamp(1.6rem, 4vw, 3rem);
    font-weight: 900;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #ffd97d, #ffb3c6, #c8b6ff, #9bf6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 18px rgba(200,180,255,0.6));
    animation: titlePulse 3s ease-in-out infinite;
  }
  #title-block p {
    margin-top: 6px;
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    color: rgba(200,210,255,0.75);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  @keyframes titlePulse {
    0%,100% { filter: drop-shadow(0 0 18px rgba(200,180,255,0.5)); }
    50%      { filter: drop-shadow(0 0 32px rgba(255,215,125,0.8)); }
  }

  /* ── Reveal Button ── */
  #btn-reveal {
    position: fixed;
    bottom: 48px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    padding: 14px 42px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #c026d3, #db2777);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(192,38,211,0.6), 0 0 60px rgba(124,58,237,0.3);
    transition: transform 0.18s, box-shadow 0.18s;
    animation: btnFloat 2.4s ease-in-out infinite;
  }
  #btn-reveal:hover {
    transform: translateX(-50%) scale(1.07);
    box-shadow: 0 0 36px rgba(219,39,119,0.8), 0 0 80px rgba(124,58,237,0.5);
  }
  #btn-reveal:active { transform: translateX(-50%) scale(0.97); }
  @keyframes btnFloat {
    0%,100% { bottom: 48px; }
    50%      { bottom: 56px; }
  }

  /* ── Greeting overlay ── */
  #greeting-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 3, 20, 0.0);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #greeting-overlay.visible {
    opacity: 1;
    pointer-events: all;
    background: rgba(5, 3, 20, 0.72);
    backdrop-filter: blur(6px);
  }
  #greeting-card {
    max-width: min(680px, 90vw);
    width: 100%;
    background: linear-gradient(145deg, rgba(30,16,60,0.95), rgba(10,8,30,0.95));
    border: 1px solid rgba(200,180,255,0.25);
    border-radius: 24px;
    padding: 44px 48px;
    text-align: center;
    box-shadow:
      0 0 60px rgba(124,58,237,0.4),
      0 0 120px rgba(192,38,211,0.2),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transform: translateY(30px) scale(0.96);
    transition: transform 0.5s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  #greeting-overlay.visible #greeting-card {
    transform: translateY(0) scale(1);
  }
  #greeting-card .quote-mark {
    font-size: 5rem;
    line-height: 0.6;
    color: rgba(200,180,255,0.3);
    display: block;
    margin-bottom: 12px;
  }
  #greeting-text {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    line-height: 1.8;
    color: #e8deff;
    font-style: italic;
    text-shadow: 0 0 12px rgba(200,180,255,0.4);
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-footer {
    margin-top: 28px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .card-footer button {
    padding: 10px 28px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #btn-next {
    background: linear-gradient(135deg, #7c3aed, #c026d3);
    color: #fff;
    box-shadow: 0 0 18px rgba(192,38,211,0.5);
  }
  #btn-next:hover { transform: scale(1.06); box-shadow: 0 0 28px rgba(192,38,211,0.8); }
  #btn-close {
    background: rgba(255,255,255,0.08);
    color: rgba(200,210,255,0.8);
    border: 1px solid rgba(200,180,255,0.2);
  }
  #btn-close:hover { transform: scale(1.06); background: rgba(255,255,255,0.14); }

  #sparkles-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 31;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    border-radius: 50%;
    animation: sparkleFly 1.2s ease-out forwards;
  }
  @keyframes sparkleFly {
    0%   { opacity:1; transform: scale(1) translate(0,0); }
    100% { opacity:0; transform: scale(0) translate(var(--tx), var(--ty)); }
  }

  /* vignette */
  body::after {
    content:'';
    position:fixed; inset:0; z-index:4;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    pointer-events:none;
  }
</style>
</head>
<body>

<!-- Stars & shooting stars background -->
<canvas id="bg-canvas"></canvas>
<!-- Particle books (sand grains) -->
<canvas id="scene-canvas"></canvas>

<!-- River + boat + woman in ao dai -->
<svg id="scene-svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- River gradient -->
    <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a3a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06101f" stop-opacity="1"/>
    </linearGradient>
    <!-- Moonlight on water -->
    <radialGradient id="moonReflect" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#c8b6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0620" stop-opacity="0"/>
    </radialGradient>
    <!-- Ao dai gradient -->
    <linearGradient id="aoDaiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e63670"/>
      <stop offset="50%" stop-color="#d42060"/>
      <stop offset="100%" stop-color="#b01555"/>
    </linearGradient>
    <linearGradient id="aoDaiHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6a0"/>
      <stop offset="100%" stop-color="#c8b050"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Boat wood grain -->
    <linearGradient id="boatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5e2a"/>
      <stop offset="60%" stop-color="#6b4218"/>
      <stop offset="100%" stop-color="#3d2208"/>
    </linearGradient>
    <clipPath id="riverClip">
      <rect x="0" y="0" width="1200" height="500"/>
    </clipPath>
  </defs>

  <!-- River surface -->
  <rect x="0" y="260" width="1200" height="240" fill="url(#riverGrad)"/>
  <rect x="0" y="260" width="1200" height="240" fill="url(#moonReflect)"/>

  <!-- Water ripple lines -->
  <g opacity="0.18" stroke="#a0b8ff" stroke-width="1" fill="none">
    <path d="M 50 290 Q 150 283 250 290 Q 350 297 450 290"/>
    <path d="M 500 310 Q 620 302 740 310 Q 860 318 980 310"/>
    <path d="M 100 340 Q 250 330 400 340 Q 550 350 700 340"/>
    <path d="M 200 370 Q 400 360 600 370 Q 800 380 1000 370"/>
    <path d="M 0 400 Q 200 392 400 400 Q 600 408 800 400 Q 1000 392 1200 400"/>
    <path d="M 150 430 Q 350 420 550 430 Q 750 440 950 430"/>
  </g>

  <!-- Moon reflection column on water -->
  <ellipse cx="600" cy="310" rx="22" ry="80" fill="#c8b6ff" opacity="0.08"/>
  <ellipse cx="600" cy="350" rx="40" ry="40" fill="#c8b6ff" opacity="0.04"/>

  <!-- === BOAT === -->
  <g id="boat" transform="translate(540, 300)" filter="url(#glow)">
    <!-- Boat shadow on water -->
    <ellipse cx="60" cy="52" rx="80" ry="10" fill="#000" opacity="0.3"/>
    <!-- Boat hull -->
    <path d="M -75,30 Q -80,20 -60,10 L 180,10 Q 200,20 195,30 Q 150,55 60,55 Q -30,55 -75,30 Z" fill="url(#boatGrad)"/>
    <!-- Boat rim highlight -->
    <path d="M -60,10 L 180,10" stroke="#c89a4a" stroke-width="2.5" opacity="0.7" fill="none"/>
    <!-- Boat inner -->
    <path d="M -55,25 Q -50,16 -30,14 L 170,14 Q 188,16 183,25 Q 140,45 60,45 Q -20,45 -55,25 Z" fill="#4a2800" opacity="0.5"/>
    <!-- Oar/pole -->
    <line x1="150" y1="10" x2="130" y2="-40" stroke="#8b5e2a" stroke-width="3" stroke-linecap="round"/>
    <!-- Bow decoration -->
    <path d="M 185,10 Q 198,5 195,20 L 183,20 Z" fill="#c89a4a" opacity="0.8"/>
  </g>

  <!-- === WOMAN IN AO DAI === -->
  <g id="woman" transform="translate(630, 170)" filter="url(#softGlow)">
    <!-- === Non La (Conical hat) === -->
    <g transform="translate(0,-2)">
      <ellipse cx="0" cy="-92" rx="35" ry="6" fill="url(#aoDaiHat)" opacity="0.9"/>
      <path d="M -35,-92 Q 0,-145 35,-92 Z" fill="url(#aoDaiHat)"/>
      <path d="M -35,-92 Q 0,-145 35,-92" stroke="#c8a830" stroke-width="1" fill="none" opacity="0.6"/>
      <!-- hat shadow line -->
      <path d="M -32,-94 Q 0,-142 32,-94" stroke="#a89020" stroke-width="0.5" fill="none" opacity="0.4"/>
      <!-- Hat string -->
      <path d="M -18,-96 Q 0,-102 18,-96" stroke="#a07820" stroke-width="1.2" fill="none" opacity="0.7"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-72" r="14" fill="#f5c5a0"/>
    <!-- Hair bun -->
    <ellipse cx="2" cy="-83" rx="10" ry="5" fill="#1a0a00"/>
    <!-- Face details -->
    <ellipse cx="-5" cy="-71" rx="2" ry="2.5" fill="#c89080" opacity="0.8"/>
    <ellipse cx="5" cy="-71" rx="2" ry="2.5" fill="#c89080" opacity="0.8"/>
    <path d="M -4,-65 Q 0,-62 4,-65" stroke="#c06060" stroke-width="1.2" fill="none"/>

    <!-- Neck -->
    <rect x="-5" y="-60" width="10" height="10" rx="3" fill="#f5c5a0"/>

    <!-- === Áo Dài body === -->
    <!-- Collar -->
    <path d="M -5,-52 Q -8,-55 0,-57 Q 8,-55 5,-52 L 0,-50 Z" fill="#c01040" opacity="0.9"/>
    <!-- Main robe top -->
    <path d="M -18,-52 Q -22,-30 -20,20 L 20,20 Q 22,-30 18,-52 Q 10,-55 0,-54 Q -10,-55 -18,-52 Z" fill="url(#aoDaiGrad)"/>
    <!-- Robe details – side slits suggestion -->
    <path d="M -20,0 Q -24,20 -18,40" stroke="#ff4080" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 20,0 Q 24,20 18,40" stroke="#ff4080" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- White inner shirt -->
    <path d="M -6,-50 Q -10,-30 -8,20 L 8,20 Q 10,-30 6,-50 Q 2,-52 0,-52 Q -2,-52 -6,-50 Z" fill="rgba(255,255,255,0.15)"/>
    <!-- Robe flap flowing down -->
    <path d="M -20,20 Q -26,80 -18,130 Q -8,150 0,152 Q 8,150 18,130 Q 26,80 20,20 Z" fill="url(#aoDaiGrad)" opacity="0.95"/>
    <!-- Flow lines on robe -->
    <path d="M -10,30 Q -12,80 -8,120" stroke="#ff5090" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M 10,30 Q 12,80 8,120" stroke="#ff5090" stroke-width="0.8" fill="none" opacity="0.4"/>

    <!-- === White trousers === -->
    <path d="M -15,135 Q -18,160 -12,170" stroke="rgba(255,255,255,0.7)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 15,135 Q 18,160 12,170" stroke="rgba(255,255,255,0.7)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- === Arms === -->
    <!-- Left arm raised slightly -->
    <path d="M -18,-40 Q -32,-20 -28,5" stroke="#f5c5a0" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Left hand -->
    <circle cx="-28" cy="8" r="5" fill="#f5c5a0"/>
    <!-- Right arm – holding lotus -->
    <path d="M 18,-40 Q 34,-15 32,10" stroke="#f5c5a0" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Right hand -->
    <circle cx="32" cy="12" r="5" fill="#f5c5a0"/>

    <!-- === Lotus flower held in right hand === -->
    <g transform="translate(32,4)">
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#4a9a30" stroke-width="2"/>
      <!-- petals -->
      <ellipse cx="0" cy="-28" rx="6" ry="10" fill="#ff8ab0" transform="rotate(-15,0,-28)" opacity="0.9"/>
      <ellipse cx="0" cy="-28" rx="6" ry="10" fill="#ff8ab0" transform="rotate(15,0,-28)" opacity="0.9"/>
      <ellipse cx="0" cy="-28" rx="6" ry="10" fill="#ffaac0" opacity="0.9"/>
      <ellipse cx="0" cy="-28" rx="5" ry="8" fill="#ffe0ee" transform="rotate(-8,0,-28)" opacity="0.8"/>
      <ellipse cx="0" cy="-28" rx="5" ry="8" fill="#ffe0ee" transform="rotate(8,0,-28)" opacity="0.8"/>
      <!-- stamen -->
      <circle cx="0" cy="-33" r="4" fill="#ffd970"/>
    </g>

    <!-- Hair strands flowing -->
    <path d="M 8,-78 Q 20,-65 18,-50" stroke="#1a0a00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Water sparkles near boat -->
  <g opacity="0.5" fill="#c8d8ff">
    <circle cx="490" cy="315" r="1.5" opacity="0.6"/>
    <circle cx="510" cy="325" r="1" opacity="0.4"/>
    <circle cx="720" cy="320" r="1.5" opacity="0.6"/>
    <circle cx="740" cy="330" r="1" opacity="0.4"/>
    <circle cx="560" cy="340" r="1" opacity="0.5"/>
    <circle cx="680" cy="345" r="1" opacity="0.5"/>
  </g>

  <!-- Floating lotus on water -->
  <g transform="translate(460, 330)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="#4a9a30" opacity="0.6"/>
    <ellipse cx="6" cy="-2" rx="5" ry="8" fill="#ff8ab0" opacity="0.8" transform="rotate(-20,6,-2)"/>
    <ellipse cx="-4" cy="-2" rx="5" ry="8" fill="#ff8ab0" opacity="0.8" transform="rotate(20,-4,-2)"/>
    <ellipse cx="1" cy="-5" rx="4" ry="7" fill="#ffd0e8" opacity="0.9"/>
    <circle cx="1" cy="-7" r="3" fill="#ffd970" opacity="0.9"/>
  </g>
  <g transform="translate(760, 345)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="10" ry="3" fill="#4a9a30" opacity="0.5"/>
    <ellipse cx="5" cy="-2" rx="4" ry="6" fill="#ff9ec0" opacity="0.8" transform="rotate(-15,5,-2)"/>
    <ellipse cx="-3" cy="-2" rx="4" ry="6" fill="#ff9ec0" opacity="0.8" transform="rotate(15,-3,-2)"/>
    <ellipse cx="1" cy="-4" rx="3" ry="6" fill="#ffe0ee" opacity="0.9"/>
    <circle cx="1" cy="-6" r="2.5" fill="#ffd970" opacity="0.9"/>
  </g>

  <!-- Willow tree left -->
  <g transform="translate(80, 180)" opacity="0.65">
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#2a4a1a" stroke-width="6"/>
    <line x1="0" y1="-60" x2="-40" y2="-20" stroke="#3a5a28" stroke-width="3"/>
    <path d="M 0,-120 Q -50,-60 -30,0" stroke="#3a7a28" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 0,-110 Q -60,-50 -40,10" stroke="#4a8a30" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 0,-100 Q -40,-40 -25,15" stroke="#3a7a28" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 0,-90 Q 30,-30 20,10" stroke="#4a8a30" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
  <!-- Willow tree right -->
  <g transform="translate(1120, 190)" opacity="0.55">
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#2a4a1a" stroke-width="5"/>
    <path d="M 0,-100 Q 50,-50 30,0" stroke="#3a7a28" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 0,-90 Q 60,-40 40,10" stroke="#4a8a30" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 0,-80 Q 40,-30 25,15" stroke="#3a7a28" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
</svg>

<!-- Title -->
<div id="title-block">
  <h1>🌸 Tri Ân Ngày Nhà Giáo Việt Nam 🌸</h1>
  <p>20 / 11 — Ngày Nhà Giáo Việt Nam</p>
</div>

<!-- Reveal button -->
<button id="btn-reveal" onclick="showGreeting()">✨ Mở Lời Tri Ân ✨</button>

<!-- Greeting overlay -->
<div id="greeting-overlay">
  <div id="greeting-card">
    <span class="quote-mark">"</span>
    <div id="greeting-text">Đang tải lời chúc...</div>
    <div class="card-footer">
      <button id="btn-next" onclick="nextGreeting()">🎲 Lời Chúc Khác</button>
      <button id="btn-close" onclick="closeGreeting()">✕ Đóng</button>
    </div>
  </div>
</div>

<!-- Sparkles container -->
<div id="sparkles-container"></div>

<script>
// ═══════════════════════════════════════════════
//  20 lời chúc 20/11
// ═══════════════════════════════════════════════
const GREETINGS = [
  "Kính chúc thầy/cô sức khỏe dồi dào, hạnh phúc tràn đầy. Những trang giáo án của thầy/cô mãi là ngọn đèn soi sáng con đường chúng em bước tới.",
  "Nhân ngày 20/11, em xin gửi đến thầy/cô lòng biết ơn sâu sắc nhất. Thầy/cô đã truyền cho chúng em không chỉ kiến thức mà còn cả nhiệt huyết với cuộc đời.",
  "Như những trang sách mở ra cả thế giới, thầy/cô đã mở ra trước mắt chúng em một chân trời tri thức bao la. Em mãi biết ơn điều đó.",
  "Chúc thầy/cô ngày Nhà Giáo Việt Nam thật ấm áp và tràn ngập yêu thương. Công ơn thầy/cô tựa như dòng sông chảy mãi không ngừng trong trái tim chúng em.",
  "Mỗi bài học thầy/cô dạy là một hạt giống tốt lành được gieo vào tâm hồn chúng em. Hôm nay và mãi mãi, chúng em trân trọng từng khoảnh khắc được học dưới mái trường có thầy/cô.",
  "Kính chúc thầy/cô luôn tươi vui, khỏe mạnh và hạnh phúc. Nghề giáo cao quý như ánh mặt trời — thầy/cô tỏa sáng để chúng em được ấm áp và trưởng thành.",
  "Nhân dịp 20/11, em muốn nói một lời thật lòng: Những năm tháng được ngồi trên ghế nhà trường, được lắng nghe tiếng giảng của thầy/cô là những ký ức đẹp nhất đời em.",
  "Chúc thầy/cô có một ngày 20/11 đong đầy niềm vui và sự trân trọng. Thầy/cô xứng đáng được nhận tất cả những điều tốt đẹp nhất từ cuộc sống này.",
  "Tri ân thầy/cô — người đã kiên nhẫn uốn nắn từng nét chữ, từng bước đi đầu đời của chúng em. Tình cảm ấy không thể nào đong đếm được.",
  "Như con thuyền vượt sóng nhờ người lái, chúng em vững bước vào đời nhờ có thầy/cô. Kính chúc thầy/cô sức khỏe và hạnh phúc ngày 20/11!",
  "Mỗi trang vở ngày xưa đều mang dấu ấn của thầy/cô — từng lời phê, từng dấu chấm đỏ nhỏ nhoi là cả một tình yêu thương mà thầy/cô dành cho chúng em.",

  "Nhân ngày 20/11, chúng em gửi đến thầy/cô những bông hoa tươi thắm nhất, những lời chúc chân thành nhất từ trái tim. Mong thầy/cô luôn khỏe mạnh và hạnh phúc!",
  "Thầy/cô là người gieo mầm tri thức, chăm bón tương lai. Mỗi học trò trưởng thành là một thành quả đáng tự hào của thầy/cô. Chúc mừng ngày Nhà Giáo Việt Nam 20/11!"
];

let lastIdx = -1;

function pickGreeting() {
  let idx;
  do { idx = Math.floor(Math.random() * GREETINGS.length); }
  while (idx === lastIdx && GREETINGS.length > 1);
  lastIdx = idx;
  return GREETINGS[idx];
}

function showGreeting() {
  document.getElementById('greeting-text').textContent = pickGreeting();
  document.getElementById('greeting-overlay').classList.add('visible');
  spawnSparkles();
  document.getElementById('btn-reveal').style.display = 'none';
}

function nextGreeting() {
  const el = document.getElementById('greeting-text');
  el.style.opacity = '0';
  el.style.transform = 'translateY(8px)';
  el.style.transition = 'opacity 0.25s, transform 0.25s';
  setTimeout(() => {
    el.textContent = pickGreeting();
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  }, 260);
  spawnSparkles();
}

function closeGreeting() {
  document.getElementById('greeting-overlay').classList.remove('visible');
  document.getElementById('btn-reveal').style.display = '';
}

function spawnSparkles() {
  const container = document.getElementById('sparkles-container');
  const colors = ['#ffd97d','#ff8ab0','#c8b6ff','#9bf6ff','#a8ff78','#ffb347'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = 4 + Math.random() * 7;
    const x = 20 + Math.random() * 60;
    const y = 30 + Math.random() * 50;
    const tx = (Math.random() - 0.5) * 180 + 'px';
    const ty = (Math.random() - 0.5) * 180 + 'px';
    s.style.cssText = `
      left:${x}%; top:${y}%;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --tx:${tx}; --ty:${ty};
      animation-delay:${Math.random()*0.4}s;
      animation-duration:${0.9+Math.random()*0.6}s;
      box-shadow: 0 0 ${size*2}px ${colors[Math.floor(Math.random()*colors.length)]};
    `;
    container.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}

// ═══════════════════════════════════════════════
//  BACKGROUND CANVAS — Stars + Shooting stars
// ═══════════════════════════════════════════════
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');

function resizeBg() {
  bgCanvas.width  = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

// Generate stars
const STAR_COUNT = 320;
const stars = [];
for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.75,
    r: 0.4 + Math.random() * 1.4,
    ph: Math.random() * Math.PI * 2,
    sp: 0.5 + Math.random() * 1.8,
    tint: ['#ffffff','#c8d8ff','#ffd8c0','#d8c8ff'][Math.floor(Math.random()*4)],
    base: 0.3 + Math.random() * 0.7
  });
}

// Shooting stars
const shooters = [];
let nextShooter = 3 + Math.random() * 4;

function spawnShooter(t) {
  shooters.push({
    born: t,
    life: 0.8 + Math.random() * 0.9,
    x0: (0.05 + Math.random() * 0.5),
    y0: (0.03 + Math.random() * 0.3),
    vx:  (0.25 + Math.random() * 0.3) * (Math.random() < 0.5 ? 1 : -1),
    vy: -(0.15 + Math.random() * 0.2),
  });
}

function drawBg(t) {
  const W = bgCanvas.width, H = bgCanvas.height;
  bgCtx.clearRect(0, 0, W, H);

  // Deep space gradient
  const grd = bgCtx.createRadialGradient(W*0.5, H*0.4, 0, W*0.5, H*0.4, W*0.9);
  grd.addColorStop(0,   '#120828');
  grd.addColorStop(0.4, '#0a0520');
  grd.addColorStop(0.8, '#060310');
  grd.addColorStop(1,   '#030108');
  bgCtx.fillStyle = grd;
  bgCtx.fillRect(0, 0, W, H);

  // Nebula blobs
  const neb = [
    { cx:0.18, cy:0.22, r:0.25, col:'rgba(80,30,120,0.09)' },
    { cx:0.80, cy:0.30, r:0.22, col:'rgba(20,60,120,0.08)' },
    { cx:0.52, cy:0.50, r:0.30, col:'rgba(60,20,100,0.06)' },
  ];
  for (const n of neb) {
    const gr = bgCtx.createRadialGradient(n.cx*W, n.cy*H, 0, n.cx*W, n.cy*H, n.r*W);
    gr.addColorStop(0, n.col);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = gr;
    bgCtx.fillRect(0, 0, W, H);
  }

  // Stars
  for (const s of stars) {
    const tw = s.base * (0.6 + 0.4 * Math.sin(t * s.sp + s.ph));
    bgCtx.globalAlpha = tw;
    bgCtx.fillStyle = s.tint;
    bgCtx.beginPath();
    bgCtx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    bgCtx.fill();
  }
  bgCtx.globalAlpha = 1;

  // Shooting stars
  for (let i = shooters.length - 1; i >= 0; i--) {
    const sh = shooters[i];
    const age = t - sh.born;
    if (age > sh.life) { shooters.splice(i, 1); continue; }
    const fade = (1 - age / sh.life) * Math.min(1, age / 0.08);
    const hx = (sh.x0 + sh.vx * age) * W;
    const hy = (sh.y0 + sh.vy * age) * H;
    const len = 60 + Math.random() * 40;
    const angle = Math.atan2(sh.vy * H, sh.vx * W);
    const tailX = hx - Math.cos(angle) * len;
    const tailY = hy - Math.sin(angle) * len;
    const sg = bgCtx.createLinearGradient(tailX, tailY, hx, hy);
    sg.addColorStop(0, 'rgba(200,220,255,0)');
    sg.addColorStop(1, `rgba(220,230,255,${fade * 0.9})`);
    bgCtx.strokeStyle = sg;
    bgCtx.lineWidth = 1.5;
    bgCtx.beginPath();
    bgCtx.moveTo(tailX, tailY);
    bgCtx.lineTo(hx, hy);
    bgCtx.stroke();
    // head glow
    bgCtx.globalAlpha = fade * 0.9;
    bgCtx.fillStyle = '#ddeeff';
    bgCtx.beginPath();
    bgCtx.arc(hx, hy, 2, 0, Math.PI*2);
    bgCtx.fill();
    bgCtx.globalAlpha = 1;
  }

  // Moon
  const mx = W * 0.82, my = H * 0.12;
  const moonGrd = bgCtx.createRadialGradient(mx-4, my-4, 2, mx, my, 38);
  moonGrd.addColorStop(0, '#fffbe8');
  moonGrd.addColorStop(0.5, '#ffe8b0');
  moonGrd.addColorStop(1, 'rgba(220,180,80,0)');
  bgCtx.fillStyle = moonGrd;
  bgCtx.beginPath();
  bgCtx.arc(mx, my, 38, 0, Math.PI*2);
  bgCtx.fill();
  // Moon halo
  bgCtx.globalAlpha = 0.12;
  const halo = bgCtx.createRadialGradient(mx, my, 36, mx, my, 90);
  halo.addColorStop(0, '#ffd97d');
  halo.addColorStop(1, 'rgba(255,180,80,0)');
  bgCtx.fillStyle = halo;
  bgCtx.beginPath();
  bgCtx.arc(mx, my, 90, 0, Math.PI*2);
  bgCtx.fill();
  bgCtx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════
//  SCENE CANVAS — Sand-grain Books
// ═══════════════════════════════════════════════
const scCanvas = document.getElementById('scene-canvas');
const scCtx = scCanvas.getContext('2d');

function resizeSc() {
  scCanvas.width  = window.innerWidth;
  scCanvas.height = window.innerHeight;
  buildBooks();
}
resizeSc();
window.addEventListener('resize', resizeSc);

// Book shapes (defined in normalized coords 0..1)
// Each book = array of particles in {nx,ny} normalized to canvas
let bookParticles = [];
const BOOK_COLS = [
  '#ffd97d','#ff8ab0','#c8b6ff','#9bf6ff','#a8e6cf','#ffb347',
  '#ffeaa7','#fd79a8','#b2bec3','#74b9ff'
];

function buildBooks() {
  bookParticles = [];
  const W = scCanvas.width, H = scCanvas.height;
  // 5 books stacked/spread in upper-center area
  const bookDefs = [
    { x: W*0.30, y: H*0.18, w: W*0.10, h: H*0.09, angle: -0.18, col: '#ffd97d', col2: '#c89a30' },
    { x: W*0.42, y: H*0.14, w: W*0.11, h: H*0.10, angle:  0.05, col: '#c8b6ff', col2: '#7c3aed' },
    { x: W*0.55, y: H*0.16, w: W*0.09, h: H*0.09, angle:  0.12, col: '#ff8ab0', col2: '#c026d3' },
    { x: W*0.65, y: H*0.19, w: W*0.10, h: H*0.08, angle: -0.08, col: '#9bf6ff', col2: '#0ea5e9' },
    { x: W*0.36, y: H*0.26, w: W*0.12, h: H*0.08, angle:  0.0,  col: '#a8e6cf', col2: '#059669' },
    { x: W*0.52, y: H*0.24, w: W*0.09, h: H*0.09, angle: -0.1,  col: '#ffb347', col2: '#c05000' },
  ];
  const GRAINS_PER_BOOK = 420;
  for (const b of bookDefs) {
    const cos = Math.cos(b.angle), sin = Math.sin(b.angle);
    for (let i = 0; i < GRAINS_PER_BOOK; i++) {
      const lx = (Math.random() - 0.5) * b.w;
      const ly = (Math.random() - 0.5) * b.h;
      const rx = lx * cos - ly * sin + b.x;
      const ry = lx * sin + ly * cos + b.y;
      // color varies: spine darker, page area lighter
      const isSpine = Math.abs(lx) > b.w * 0.42;
      const isPage  = Math.abs(lx) < b.w * 0.38 && !isSpine;
      let col;
      if (isSpine) col = b.col2;
      else if (Math.abs(ly) > b.h * 0.44) col = hexLerp(b.col, '#ffffff', 0.7);
      else col = hexLerp(b.col, '#ffffff', Math.random() * 0.3);
      bookParticles.push({
        x: rx, y: ry,
        tx: rx, ty: ry,
        // for float animation
        ox: rx, oy: ry,
        ph: Math.random() * Math.PI * 2,
        sp: 0.4 + Math.random() * 1.0,
        col,
        r: 0.9 + Math.random() * 1.1,
      });
    }
    // Add lines (page lines) as thin grain streaks
    const lineCount = 5;
    for (let li = 0; li < lineCount; li++) {
      const lineY = (li / lineCount - 0.5 + 1/(lineCount*2)) * b.h;
      const lineGrains = 60;
      for (let g = 0; g < lineGrains; g++) {
        const lx = ((g / lineGrains) - 0.5) * b.w * 0.72;
        const ly = lineY + (Math.random()-0.5)*1.5;
        const rx = lx * cos - ly * sin + b.x;
        const ry = lx * sin + ly * cos + b.y;
        bookParticles.push({
          x: rx, y: ry, tx: rx, ty: ry, ox: rx, oy: ry,
          ph: Math.random() * Math.PI * 2,
          sp: 0.3 + Math.random() * 0.8,
          col: hexLerp(b.col2, '#c0c0d0', 0.5),
          r: 0.5,
        });
      }
    }
  }
}

function hexLerp(a, b, t) {
  const pa = hexParse(a), pb = hexParse(b);
  const r = Math.round(pa[0] + (pb[0]-pa[0])*t);
  const g = Math.round(pa[1] + (pb[1]-pa[1])*t);
  const bv = Math.round(pa[2] + (pb[2]-pa[2])*t);
  return `rgb(${r},${g},${bv})`;
}
function hexParse(h) {
  h = h.replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

function drawScene(t) {
  const W = scCanvas.width, H = scCanvas.height;
  scCtx.clearRect(0, 0, W, H);
  for (const p of bookParticles) {
    // gentle float
    const dx = Math.sin(t * p.sp + p.ph) * 1.8;
    const dy = Math.cos(t * p.sp * 0.7 + p.ph) * 1.4;
    const px = p.ox + dx, py = p.oy + dy;
    scCtx.globalAlpha = 0.82 + 0.18 * Math.sin(t * p.sp * 1.3 + p.ph);
    scCtx.fillStyle = p.col;
    scCtx.beginPath();
    scCtx.arc(px, py, p.r, 0, Math.PI * 2);
    scCtx.fill();
  }
  scCtx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════
//  Boat & woman floating animation via SVG
// ═══════════════════════════════════════════════
const boatEl   = document.getElementById('boat');
const womanEl  = document.getElementById('woman');

function animateSVG(t) {
  const bobY  = Math.sin(t * 0.7) * 3;
  const bobR  = Math.sin(t * 0.5) * 1.2;
  boatEl.setAttribute('transform', `translate(${540 + Math.sin(t*0.4)*6}, ${300 + bobY}) rotate(${bobR}, 60, 30)`);
  const wX = 630 + Math.sin(t*0.4)*6;
  const wY = 170 + bobY + Math.sin(t * 1.2) * 0.8;
  womanEl.setAttribute('transform', `translate(${wX}, ${wY})`);
}

// ═══════════════════════════════════════════════
//  Main loop
// ═══════════════════════════════════════════════
let startTime = null;
let lastShooterT = 0;
let shooterInterval = 4 + Math.random() * 5;

function loop(ts) {
  if (!startTime) startTime = ts;
  const t = (ts - startTime) / 1000;

  drawBg(t);
  drawScene(t);
  animateSVG(t);

  // Spawn shooting stars
  if (t - lastShooterT > shooterInterval) {
    spawnShooter(t);
    lastShooterT = t;
    shooterInterval = 4 + Math.random() * 7;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
