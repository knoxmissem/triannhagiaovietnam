"Con xin gửi đến thầy cô lời chúc tốt đẹp nhất nhân ngày 20/11. Chúc thầy cô luôn vui vẻ, yêu đời, mạnh khỏe và gặp nhiều điều thuận lợi trong cuộc sống. Cảm ơn thầy cô đã luôn bao dung trước những thiếu sót, kiên nhẫn sửa chữa những lỗi sai và giúp chúng con ngày càng tiến bộ hơn. Mong thầy cô sẽ luôn nhận được thật nhiều tình cảm yêu thương từ học trò.",

"Con kính chúc thầy cô một ngày Nhà giáo Việt Nam thật đáng nhớ, ngập tràn hoa tươi, lời chúc và những nụ cười hạnh phúc. Chúc thầy cô luôn trẻ trung, yêu đời và có thật nhiều năng lượng tích cực mỗi ngày. Cảm ơn thầy cô vì đã luôn đồng hành, quan tâm và giúp chúng con có thêm niềm tin trên hành trình học tập.",
"Nhân ngày 20/11, con xin gửi lời tri ân chân thành nhất đến thầy cô. Chúc thầy cô luôn mạnh khỏe, gia đình hạnh phúc, công việc thuận lợi và mọi dự định đều đạt được kết quả tốt đẹp. Cảm ơn thầy cô đã dành cả tâm huyết để gieo những hạt giống tri thức, giúp chúng con từng bước trưởng thành và tự tin theo đuổi ước mơ.",

"Nhân ngày Nhà giáo Việt Nam 20/11, con xin chân thành cảm ơn thầy cô vì đã luôn tận tâm chỉ dạy và giúp đỡ chúng con. Những kiến thức, lời khuyên và bài học mà thầy cô truyền đạt sẽ luôn là hành trang quý báu trên con đường trưởng thành của chúng con. Kính chúc thầy cô luôn bình an, hạnh phúc và thành công trong mọi lĩnh vực.",

"Nhân dịp Ngày Nhà giáo Việt Nam 20/11, con xin gửi đến thầy cô lời chúc mừng và lòng biết ơn sâu sắc nhất. Cảm ơn thầy cô đã luôn tận tụy, kiên nhẫn và hết lòng vì học sinh, không chỉ truyền đạt tri thức mà còn dạy chúng con những bài học quý giá về cuộc sống. Con kính chúc thầy cô luôn mạnh khỏe, hạnh phúc, bình an và thành công trên con đường mình đã chọn. Mong rằng thầy cô sẽ mãi là những người lái đò đáng kính, chắp cánh cho thật nhiều ước mơ bay xa."
];

cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;idle=tm;
if(pts.size==1){cam.yaw-=dx*.006;cam.pitch=cl(cam.pitch+dy*.004,-.1,1.2);cam.vy=cam.vy*.5-dx*.18}
else if(pts.size==2){const[a,b]=[...pts.values()],nd=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd>0&&nd>0)cam.dist=cl(cam.dist*pd/nd,9,32);pd=nd}});
const up=e=>{pts.delete(e.pointerId)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=cl(cam.dist*Math.exp(e.deltaY*.001),9,32);idle=tm},{passive:false});

const env=document.getElementById('env'),ltr=document.getElementById('ltr'),txt=document.getElementById('txt'),ttl=document.getElementById('ttl'),btn=document.getElementById('btn');
let bag=[],last=-1,first=true;
function pick(){if(!bag.length)bag=M.map((_,i)=>i).sort(()=>R()-.5);let i=bag.pop();if(i===last&&bag.length){const j=bag.pop();bag.push(i);i=j}last=i;return M[i]}
btn.addEventListener('click',()=>{if(busy)return;busy=true;pulse=1;ttl.classList.add('hide');const w=env.classList.contains('rd');env.classList.remove('rd','op');
setTimeout(()=>{txt.textContent=pick();ltr.scrollTop=0;env.classList.add('on');btn.textContent='Phong thư khác';
setTimeout(()=>env.classList.add('op'),w?700:900);setTimeout(()=>env.classList.add('rd'),w?1700:1900);setTimeout(()=>{busy=false},w?2900:3100)},w?900:0)});
let busy=false;

let T0=performance.now(),ema=0,fc=0;
function frame(now){
const dt=Math.min(.05,(now-T0)/1000);T0=now;tm+=dt;
snowStep(dt,tm);pulse*=Math.exp(-dt*1.5);
if(!pts.size){cam.yaw+=cam.vy*dt;cam.vy*=Math.pow(.9,dt*60);if(tm-idle>2.5)cam.yaw+=.12*dt}
const t1=performance.now();render(tm);
const ms=performance.now()-t1;if(dt<.2){ema=ema*.95+ms*.05;if(++fc%90==0&&ema>20&&S>.5){S*=.85;alloc()}}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
